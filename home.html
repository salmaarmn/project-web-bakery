<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Sun &amp; Flour: Baking Your Day a Little Brighter.">
	<title>Sun &amp; Flour | Bakery</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="top-section">
	<header class="site-header">
		<a class="brand" href="#beranda" aria-label="Sun & Flour, beranda">
			<span class="brand-mark" aria-hidden="true">🌻</span>
			<span>Sun & Flour<span class="brand-dot">.</span></span>
		</a>
		<nav class="site-nav" aria-label="Navigasi utama">
			<a class="nav-link active" href="#beranda">Beranda</a>
			<span class="nav-link nav-link-disabled" aria-disabled="true">Menu</span>
		</nav>
	</header>

	<main>
		<section class="hero" id="beranda">
			<div class="floating-breads" aria-hidden="true">
				<span class="floating-bread bread-one">🥐</span>
				<span class="floating-bread bread-two">🍞</span>
				<span class="floating-bread bread-three">🥨</span>
				<span class="floating-bread bread-four">🥖</span>
				<span class="floating-bread bread-five">🥯</span>
				<span class="floating-bread bread-six">🍩</span>
				<span class="floating-bread bread-seven">🥪</span>
				<span class="floating-bread bread-eight">🥞</span>
				<span class="floating-bread bread-nine">🧇</span>
				<span class="floating-bread bread-ten">🍪</span>
				<span class="floating-bread bread-eleven">🥧</span>
				<span class="floating-bread bread-twelve">🫓</span>
			</div>
			<div class="hero-copy">
				<p class="eyebrow">Sun &amp; Flour Bakery</p>
				<h1><span>Baking Your Day</span>
					<em>a Little Brighter</em>
				</h1>
				<button class="primary-link" type="button" disabled aria-label="Menu segera hadir">
					Lihat Menu <span aria-hidden="true">↘</span>
				</button>
			</div>

			<div class="hero-art">
				<img class="hero-photo" src="roti.jpg" alt="Roti artisan">
			</div>
		</section>
	</main>
	</div>
</body>
</html>
